
name: Build Android APK (خردوات المامو)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check TypeScript
        run: npm run lint

      - name: Restore signing keystore
        uses: actions/cache@v4
        with:
          path: android/keystore
          key: almamo-release-keystore-v1

      - name: Prepare signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p android/keystore
          KS="$GITHUB_WORKSPACE/android/keystore/almamo-release.jks"

          STORE_PASS="${STORE_PASS:-almamo123456}"
          KEY_ALIAS="${KEY_ALIAS:-almamo}"
          KEY_PASS="${KEY_PASS:-$STORE_PASS}"

          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$KS"
          elif [ ! -f "$KS" ]; then
            keytool -genkeypair -v \
              -keystore "$KS" \
              -storepass "$STORE_PASS" \
              -alias "$KEY_ALIAS" \
              -keypass "$KEY_PASS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=AlMamo Hardware, O=AlMamo, C=SY"
          fi

          {
            echo "ALMAMO_KEYSTORE_FILE=$KS"
            echo "ALMAMO_KEYSTORE_PASSWORD=$STORE_PASS"
            echo "ALMAMO_KEY_ALIAS=$KEY_ALIAS"
            echo "ALMAMO_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

          keytool -list -v \
            -keystore "$KS" \
            -storepass "$STORE_PASS" \
            -alias "$KEY_ALIAS" > cert.txt

          SHA1=$(grep -m1 'SHA1:' cert.txt | sed 's/.*SHA1: *//' | tr -d ' ')
          SHA256=$(grep -m1 'SHA256:' cert.txt | sed 's/.*SHA256: *//' | tr -d ' ')

          echo "SHA1=$SHA1" >> "$GITHUB_OUTPUT"
          echo "SHA256=$SHA256" >> "$GITHUB_OUTPUT"

          mkdir -p public/.well-known

          SHA256_VAL="$SHA256" node -e "
          const fs = require('fs');
          const sha = process.env.SHA256_VAL;
          const data = [{
            relation: ['delegate_permission/common.handle_all_urls'],
            target: {
              namespace: 'android_app',
              package_name: 'com.almamo.hardware',
              sha256_cert_fingerprints: sha ? [sha] : []
            }
          }];
          fs.writeFileSync(
            'public/.well-known/assetlinks.json',
            JSON.stringify(data, null, 2) + '\n'
          );
          "

          {
            echo "## Android signing fingerprints"
            echo "Package: com.almamo.hardware"
            echo "SHA-1: $SHA1"
            echo "SHA-256: $SHA256"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Firebase Google Services
        shell: bash
        env:
          GS_SECRET: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS_SECRET" ]; then
            mkdir -p android/app
            printf '%s' "$GS_SECRET" > /tmp/google-services-input
            node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('/tmp/google-services-input', 'utf8').trim();
            const json = raw.startsWith('{')
              ? raw
              : Buffer.from(raw, 'base64').toString('utf8');
            JSON.parse(json);
            fs.writeFileSync('android/app/google-services.json', json);
            "
            rm -f /tmp/google-services-input
          else
            echo "No Google Services secret supplied; continuing without it."
          fi

      - name: Build web application
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
            almamo-hardware-store.apk
          ls -lh almamo-hardware-store.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: almamo-hardware-store-apk
          path: almamo-hardware-store.apk
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: almamo-hardware-store.apk
          generate_release_notes: true
